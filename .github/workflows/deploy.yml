name: Deploy to VPS

on:
  push:
    branches:
      - claude/operator-os-dashboard-p0Z8n

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa 2.24.125.19 >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          ssh root@2.24.125.19 "HERMES_API_KEY='${HERMES_API_KEY}' bash -s" <<'REMOTE'
            set -e
            cd /root/mygithubpage
            git fetch origin claude/operator-os-dashboard-p0Z8n
            git reset --hard origin/claude/operator-os-dashboard-p0Z8n

            echo '── Operator OS ──'
            cd /root/mygithubpage/operator-os
            npm install --legacy-peer-deps --silent
            pm2 restart operator-os 2>/dev/null || \
              pm2 start 'npm run dev -- --port 3737' --name operator-os

            echo '── Seed agent registry ──'
            python3 - <<'EOF'
import json, pathlib, os, sys
config_dir = pathlib.Path(os.path.expanduser('~/agent-os/config'))
config_dir.mkdir(parents=True, exist_ok=True)
f = config_dir / 'agents.json'

hermes_key = os.environ.get('HERMES_API_KEY', '')

desired = {
  'id': 'hermes',
  'name': 'Hermes',
  'url': 'http://127.0.0.1:8642',        # API server — /v1/chat/completions
  'chat_endpoint': '/v1/chat/completions',
  'health_endpoint': '/health',
  'health_url': 'http://127.0.0.1:9119/api/status',  # native dashboard health
  'color': '#8B5CF6',
  'model': 'deepseek-v4-flash',
  'api_key': hermes_key,
}

if f.exists():
    try:
        existing = json.loads(f.read_text())
        if not isinstance(existing, list):
            raise ValueError("not a list")
        idx = next((i for i, a in enumerate(existing) if a.get('id') == 'hermes'), None)
        if idx is not None:
            existing[idx].update(desired)
            f.write_text(json.dumps(existing, indent=2))
            print('Updated Hermes entry')
        else:
            existing.append(desired)
            f.write_text(json.dumps(existing, indent=2))
            print('Added Hermes entry')
    except Exception as e:
        print(f'Re-creating agents.json: {e}')
        f.write_text(json.dumps([desired], indent=2))
else:
    f.write_text(json.dumps([desired], indent=2))
    print('Created agents.json with Hermes defaults')
EOF

            pm2 save
            echo "✅ Deployed at $(date)"
REMOTE
