name: Deploy to VPS

on:
  push:
    branches:
      - claude/operator-os-dashboard-p0Z8n

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa 2.24.125.19 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh root@2.24.125.19 "
            set -e
            cd /root/mygithubpage
            git pull origin claude/operator-os-dashboard-p0Z8n

            echo '── Operator OS ──'
            cd /root/mygithubpage/operator-os
            npm install --legacy-peer-deps --silent
            pm2 restart operator-os 2>/dev/null || \
              pm2 start 'npm run dev -- --port 3737' --name operator-os

            echo '── Hermes ──'
            command -v pip3 &>/dev/null || apt install python3-pip -y -q
            cd /root/mygithubpage/hermes-server
            pip3 install -r requirements.txt -q
            if [ -f .env ]; then
              pm2 restart hermes 2>/dev/null || \
                pm2 start main.py --interpreter python3 --name hermes
            else
              echo '⚠  hermes/.env not found — skipping hermes start'
            fi

            pm2 save
            echo '✅ Deployed at \$(date)'
          "
