name: Deploy to VPS

on:
  push:
    branches:
      - claude/operator-os-dashboard-p0Z8n

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa 2.24.125.19 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh root@2.24.125.19 "
            cd /root/mygithubpage &&
            git pull origin claude/operator-os-dashboard-p0Z8n &&
            cd operator-os &&
            npm install --legacy-peer-deps --silent &&
            pm2 restart operator-os || pm2 start 'npm run dev -- --port 3737' --name operator-os &&
            echo '✅ Deployed at \$(date)'
          "
