name: Deploy to VPS

on:
  push:
    branches:
      - claude/operator-os-dashboard-p0Z8n

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa 2.24.125.19 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh root@2.24.125.19 "
            set -e
            cd /root/mygithubpage
            git pull origin claude/operator-os-dashboard-p0Z8n

            echo '── Kill phantom hermes shim ──'
            pm2 stop hermes 2>/dev/null && pm2 delete hermes 2>/dev/null || true

            echo '── Operator OS ──'
            cd /root/mygithubpage/operator-os
            npm install --legacy-peer-deps --silent
            pm2 restart operator-os 2>/dev/null || \
              pm2 start 'npm run dev -- --port 3737' --name operator-os

            echo '── Fix agent registry (point to real Hermes) ──'
            python3 - <<'EOF'
import json, pathlib, os
f = pathlib.Path(os.path.expanduser('~/agent-os/config/agents.json'))
if f.exists():
    agents = json.loads(f.read_text())
    changed = False
    for a in agents:
        if a.get('id') == 'hermes' and 'localhost' in a.get('url', ''):
            a['url'] = 'https://agent.ryanmeza.com'
            a['chat_endpoint'] = '/chat'
            a['health_endpoint'] = '/health'
            changed = True
    if changed:
        f.write_text(json.dumps(agents, indent=2))
        print('Updated hermes → https://agent.ryanmeza.com')
    else:
        print('Agent registry already correct')
else:
    print('agents.json not found — default in code will apply')
EOF

            pm2 save
            echo '✅ Deployed at \$(date)'
          "
